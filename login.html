<!DOCTYPE html>
<html>

<head>

<title>HYDRO LOGIN</title>

<style>

body{
    margin:0;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.login-box{
    width:350px;
    background:#1e293b;
    padding:40px;
    border-radius:10px;
}

h1{
    color:#facc15;
    text-align:center;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#22c55e;
    border:none;
    color:white;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="login-box">

<h1>HYDRO SPARES</h1>

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
